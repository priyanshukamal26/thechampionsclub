<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0e0d0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141310" />
      <stop offset="100%" stop-color="#0a0a08" />
    </linearGradient>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4502b" />
      <stop offset="100%" stop-color="#963c1e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5b842" />
      <stop offset="100%" stop-color="#ab8216" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a6f97" />
      <stop offset="100%" stop-color="#014f86" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2a6f97" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Grid decoration lines -->
  <line x1="80" y1="110" x2="1520" y2="110" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="80" y1="830" x2="1520" y2="830" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Header -->
  <text x="80" y="65" font-size="12" font-weight="700" fill="#2a6f97" letter-spacing="3">WORKFLOW 03 · STATUTORY COMPLIANCE &amp; SAFETY</text>
  <text x="80" y="96" font-size="28" font-weight="800" fill="#f8f6f0" letter-spacing="-0.5">DPDP Act 2023 Minor Athlete Consent Pipeline</text>
  <rect x="1290" y="55" width="230" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="1308" cy="72" r="5" fill="#2a6f97" />
  <text x="1322" y="77" font-size="11" font-weight="600" fill="#2a6f97" letter-spacing="1">INVARIANT 5 GUARANTEED</text>

  <!-- 5-STEP HORIZONTAL PIPELINE -->

  <!-- STEP 1 -->
  <g transform="translate(80, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#blueGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">01</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#2a6f97" letter-spacing="1">ENROLLMENT</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Age Evaluation</text>

    <!-- Content -->
    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Athlete Profile Creation</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Date of Birth (DOB) Capture</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Evaluated against current date</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Age threshold: Exactly 18 yrs</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#c4502b">If &lt; 18: Flagged as Minor</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Statutory Trigger</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">India DPDP Act 2023 §9</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">"Processing of personal data</text>
    <text x="32" y="288" font-size="11" fill="#8f8c82">of children requires verifiable</text>
    <text x="32" y="306" font-size="11" fill="#8f8c82">parental consent"</text>
    <text x="32" y="336" font-size="10.5" fill="#2a6f97">is_minor = true committed</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#2a6f97" letter-spacing="1">INITIAL STATE</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Account Status: PENDING</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Parent details mandatory</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="345" y1="375" x2="365" y2="375" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 2 -->
  <g transform="translate(370, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#c4502b" stroke-width="1.5" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#clayGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">02</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#c4502b" letter-spacing="1">PROTECTIVE GATE</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Read-Only Lockdown</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#c4502b" stroke-opacity="0.3" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#c4502b">Invariant 5 Gate</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Minor Dashboard Enforced</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Booking actions disabled</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Tournament sign-up locked</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#c4502b">No financial transaction allowed</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">UI Enforcement</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">Amber Compliance Banner</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">"Parental Consent Required"</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">Buttons swapped with</text>
    <text x="32" y="312" font-size="11" fill="#f8f6f0">"Consent Pending" badge</text>
    <text x="32" y="334" font-size="10.5" fill="#2d6a4f">Failsafe default: Safe State</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#c4502b" stroke-opacity="0.2" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#c4502b" letter-spacing="1">ZERO EXPOSURE</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Zero unconsented data use</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Complete legal protection</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="635" y1="375" x2="655" y2="375" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 3 -->
  <g transform="translate(660, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#blueGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">03</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#2a6f97" letter-spacing="1">OUTREACH</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Parent Dispatch</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Guardian Notification</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Automated Email Dispatch</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">To registered parent email</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Cryptographic Token Link</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#2a6f97">48-hour secure expiration</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Digital Declarations</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">Parent reviews terms:</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">• Athletic activity liability</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">• Emergency medical consent</text>
    <text x="32" y="312" font-size="11" fill="#8f8c82">• Data storage declaration</text>
    <text x="32" y="334" font-size="10.5" fill="#2d6a4f">1-Click Parental Approval</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#2a6f97" letter-spacing="1">PARENT ACTION</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Digital Signature Captured</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Status: PARENT_ACKNOWLEDGED</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="925" y1="375" x2="945" y2="375" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 4 -->
  <g transform="translate(950, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#goldGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">04</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#e5b842" letter-spacing="1">FRONT DESK DUAL CHECK</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">In-Person Verification</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Desk Staff Verification</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Physical check-in at reception</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Guardian Govt ID inspection</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">(Aadhaar / Passport / DL)</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#e5b842">Staff member ID recorded</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Verification Seal</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">SMS OTP / In-person sign-off</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">Staff overrides hold in POS</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">Timestamp &amp; Staff UUID</text>
    <text x="32" y="312" font-size="11" fill="#8f8c82">Immutable DB record</text>
    <text x="32" y="334" font-size="10.5" fill="#2d6a4f">✓ Dual-key security model</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#e5b842" letter-spacing="1">DESK COMPLETION</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Verified by Front Desk Staff</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Instant permission cascade</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="1215" y1="375" x2="1235" y2="375" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 5 -->
  <g transform="translate(1240, 140)" filter="url(#cardShadow)">
    <rect width="280" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#greenGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">05</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#2d6a4f" letter-spacing="1">PRIVILEGES LIVE</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Full Club Access</text>

    <rect x="20" y="75" width="240" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Account Transition</text>
    <text x="32" y="118" font-size="11" fill="#2d6a4f">Status: VERIFIED_MINOR</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Consent badge unlocked</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Digital Pass active with</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#2d6a4f">Parent emergency contact</text>

    <rect x="20" y="200" width="240" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Unlocked Features</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">1. 18-Arena Court Booking</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">2. Junior Coaching Sessions</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">3. Friday Social (Junior bracket)</text>
    <text x="32" y="312" font-size="11" fill="#8f8c82">4. Turnstile biometric QR entry</text>
    <text x="32" y="334" font-size="10.5" fill="#2d6a4f">100% compliant operations</text>

    <rect x="20" y="365" width="240" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#2d6a4f" letter-spacing="1">AUDIT READY</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Ready for regulatory review</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Zero liability for clubhouse</text>
  </g>

  <!-- BOTTOM SUMMARY CARD -->
  <g transform="translate(80, 640)" filter="url(#cardShadow)">
    <rect width="1440" height="160" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="28" y="24" width="6" height="112" rx="3" fill="url(#blueGrad)" />
    
    <text x="50" y="48" font-size="11" font-weight="700" fill="#2a6f97" letter-spacing="2">KEY SLIDE TAKEAWAYS</text>
    <text x="50" y="74" font-size="18" font-weight="700" fill="#f8f6f0">Statutory DPDP Compliance: Automatic Minor Protection with Verifiable Parental Consent</text>
    
    <g transform="translate(50, 95)">
      <circle cx="6" cy="6" r="4" fill="#2a6f97" />
      <text x="20" y="10" font-size="12" font-weight="600" fill="#f8f6f0">Failsafe Invariant 5 Enforcement:</text>
      <text x="260" y="10" font-size="12" fill="#a09d95">Any athlete under 18 is automatically placed in a read-only lock, blocking unverified court reservations or event bookings.</text>
      
      <circle cx="6" cy="30" r="4" fill="#c4502b" />
      <text x="20" y="34" font-size="12" font-weight="600" fill="#f8f6f0">Dual-Channel Guardian Verification:</text>
      <text x="260" y="34" font-size="12" fill="#a09d95">Combines cryptographic digital email declaration with physical front desk OTP/ID check to satisfy Section 9 of the DPDP Act 2023.</text>
      
      <circle cx="6" cy="54" r="4" fill="#2d6a4f" />
      <text x="20" y="58" font-size="12" font-weight="600" fill="#f8f6f0">Transparent Emergency Readiness:</text>
      <text x="260" y="58" font-size="12" fill="#a09d95">Directly embeds guardian contacts into the member's digital QR pass for instantaneous court-side emergency response.</text>
    </g>
  </g>
</svg>

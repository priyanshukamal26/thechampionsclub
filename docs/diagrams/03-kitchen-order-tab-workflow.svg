<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0e0d0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141310" />
      <stop offset="100%" stop-color="#0a0a08" />
    </linearGradient>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4502b" />
      <stop offset="100%" stop-color="#963c1e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5b842" />
      <stop offset="100%" stop-color="#ab8216" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e5b842" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Grid decoration lines -->
  <line x1="80" y1="110" x2="1520" y2="110" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="80" y1="830" x2="1520" y2="830" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Header -->
  <text x="80" y="65" font-size="12" font-weight="700" fill="#e5b842" letter-spacing="3">WORKFLOW 02 · HOSPITALITY &amp; F&amp;B ENGINE</text>
  <text x="80" y="96" font-size="28" font-weight="800" fill="#f8f6f0" letter-spacing="-0.5">Kitchen Order, FIFO Queue &amp; Member Tab Workflow</text>
  <rect x="1310" y="55" width="210" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="1328" cy="72" r="5" fill="#e5b842" />
  <text x="1342" y="77" font-size="11" font-weight="600" fill="#e5b842" letter-spacing="1">INVARIANTS 3 &amp; 4 ACTIVE</text>

  <!-- 5-STEP HORIZONTAL PIPELINE -->

  <!-- STEP 1 -->
  <g transform="translate(80, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#goldGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">01</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#e5b842" letter-spacing="1">ORDER CAPTURE</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Multi-Channel Ingest</text>

    <!-- Content -->
    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Ordering Channels</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">1. Bar Floor Table QR (T01-T12)</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">2. Member Mobile App / Lounge</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">3. Front Desk &amp; Bar POS</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#e5b842">Live 5% Privilege discount applied</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Order Composition</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">Menu Items + Modifiers</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">Destination Table / Takeaway</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">Payment: Tab vs Instant</text>
    <text x="32" y="314" font-size="11" fill="#8f8c82">Chef special instructions</text>
    <text x="32" y="336" font-size="10.5" fill="#2d6a4f">✓ Zero duplicate entry</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#e5b842" letter-spacing="1">PAYLOAD DISPATCH</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">POST /api/orders</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Atomic DB sequence generation</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="345" y1="375" x2="365" y2="375" stroke="#e5b842" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 2 -->
  <g transform="translate(370, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#goldGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">02</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#e5b842" letter-spacing="1">QUEUE RESOLUTION</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">FIFO Queue Engine</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Position Calculation</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Global Kitchen Ticket Roster</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Ticket Ranking: created_at ASC</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Position: #2 (1 ahead of you)</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#2d6a4f">✓ Invariant 3: FIFO purity</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Status Harmonization</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">Card 1: "Your Queue Position"</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">Card 2: "Active Orders Total"</text>
    <text x="32" y="292" font-size="10.5" fill="#f8f6f0">Distinguishes personal rank</text>
    <text x="32" y="310" font-size="10.5" fill="#f8f6f0">vs club-wide kitchen tickets</text>
    <text x="32" y="334" font-size="11" fill="#2d6a4f">Zero user ambiguity</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#e5b842" letter-spacing="1">REAL-TIME BROADCAST</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">tcc_orders_updated event</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">All surfaces update in sync</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="635" y1="375" x2="655" y2="375" stroke="#e5b842" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 3 -->
  <g transform="translate(660, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#e5b842" stroke-width="1.5" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#goldGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">03</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#e5b842" letter-spacing="1">KITCHEN DISPLAY</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Chef Vikram KDS</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#e5b842" stroke-opacity="0.3" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#e5b842">Live Ticket Pass</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Visual Kanban ticket cards</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Item breakdown &amp; timer</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Color-coded prep urgency</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#f8f6f0">Audio chime on new order</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">3-State Transitions</text>
    <text x="32" y="248" font-size="11" fill="#e5b842">1. PLACED (Incoming ticket)</text>
    <text x="32" y="270" font-size="11" fill="#c4502b">2. PREPARING (Cooking)</text>
    <text x="32" y="292" font-size="11" fill="#2d6a4f">3. READY (Ready to expedite)</text>
    <text x="32" y="314" font-size="11" fill="#8f8c82">4. SERVED (Delivered)</text>
    <text x="32" y="336" font-size="10.5" fill="#2d6a4f">✓ 1-click status advance</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#e5b842" stroke-opacity="0.2" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#e5b842" letter-spacing="1">KITCHEN WORKFLOW</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Zero lost paper chits</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Expedited table delivery</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="925" y1="375" x2="945" y2="375" stroke="#e5b842" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 4 -->
  <g transform="translate(950, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#clayGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">04</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#c4502b" letter-spacing="1">FLOOR VISUALIZER</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">12-Table Floor Map</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">3 Club Zones</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Lounge (T01, T04, T07, T10)</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Terrace (T02, T05, T08, T11)</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Bar High-Tops (T03, T06, T09, T12)</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#e5b842">Live occupancy telemetry</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Table State Engine</text>
    <text x="32" y="248" font-size="11" fill="#2d6a4f">● FREE (Green indicator)</text>
    <text x="32" y="270" font-size="11" fill="#e5b842">● RESERVED (Gold indicator)</text>
    <text x="32" y="292" font-size="11" fill="#c4502b">● SEATED (Clay indicator)</text>
    <text x="32" y="314" font-size="11" fill="#8f8c82">Direct tap to view running tab</text>
    <text x="32" y="336" font-size="10.5" fill="#2d6a4f">✓ Synchronized with DB</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#c4502b" letter-spacing="1">FLOOR CAPTAIN</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">1-Click Table Release</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Instant turnover optimization</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="1215" y1="375" x2="1235" y2="375" stroke="#e5b842" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 5 -->
  <g transform="translate(1240, 140)" filter="url(#cardShadow)">
    <rect width="280" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#greenGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">05</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#2d6a4f" letter-spacing="1">SETTLEMENT &amp; AUDIT</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Tab &amp; Z-Report</text>

    <rect x="20" y="75" width="240" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Invariant 4: Tab Balance</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Running balance accumulation</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Payment: Cash, Card, UPI, Tab</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Zero unbilled item loss</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#2d6a4f">✓ Audit trail on every item</text>

    <rect x="20" y="200" width="240" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">F&amp;B GST SAC 996331</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">5% GST rate (2.5% CGST + SGST)</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">Daily Z-Report aggregation:</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">• Total Sales: ₹3,791 active</text>
    <text x="32" y="312" font-size="11" fill="#8f8c82">• Cash / Digital split verified</text>
    <text x="32" y="334" font-size="10.5" fill="#2d6a4f">Exportable audit CSV/PDF</text>

    <rect x="20" y="365" width="240" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#2d6a4f" letter-spacing="1">CLEARED &amp; ARCHIVED</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Table reset to FREE</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Receipt printed / emailed</text>
  </g>

  <!-- BOTTOM SUMMARY CARD -->
  <g transform="translate(80, 640)" filter="url(#cardShadow)">
    <rect width="1440" height="160" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="28" y="24" width="6" height="112" rx="3" fill="url(#goldGrad)" />
    
    <text x="50" y="48" font-size="11" font-weight="700" fill="#e5b842" letter-spacing="2">KEY SLIDE TAKEAWAYS</text>
    <text x="50" y="74" font-size="18" font-weight="700" fill="#f8f6f0">Unified F&amp;B Architecture: Zero Wait Ambiguity, Instant Kitchen Prep &amp; Perfect GST Ledger</text>
    
    <g transform="translate(50, 95)">
      <circle cx="6" cy="6" r="4" fill="#e5b842" />
      <text x="20" y="10" font-size="12" font-weight="600" fill="#f8f6f0">Transparent FIFO Queue:</text>
      <text x="240" y="10" font-size="12" fill="#a09d95">Members see exact individual queue rank (#2) alongside total active kitchen load (8 tickets), eliminating wait frustration.</text>
      
      <circle cx="6" cy="30" r="4" fill="#c4502b" />
      <text x="20" y="34" font-size="12" font-weight="600" fill="#f8f6f0">Floor Map Telemetry:</text>
      <text x="240" y="34" font-size="12" fill="#a09d95">12 tables across 3 distinct zones update seating states in real time, synchronizing front desk and lounge staff seamlessly.</text>
      
      <circle cx="6" cy="54" r="4" fill="#2d6a4f" />
      <text x="20" y="58" font-size="12" font-weight="600" fill="#f8f6f0">Double-Entry Tab Settlement:</text>
      <text x="240" y="58" font-size="12" fill="#a09d95">All orders map directly to member accounts with automated 5% GST calculation, rolling up into the daily executive Z-report.</text>
    </g>
  </g>
</svg>

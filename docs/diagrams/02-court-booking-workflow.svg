<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0e0d0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141310" />
      <stop offset="100%" stop-color="#0a0a08" />
    </linearGradient>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4502b" />
      <stop offset="100%" stop-color="#963c1e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5b842" />
      <stop offset="100%" stop-color="#ab8216" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c4502b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Grid decoration lines -->
  <line x1="80" y1="110" x2="1520" y2="110" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="80" y1="830" x2="1520" y2="830" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Header -->
  <text x="80" y="65" font-size="12" font-weight="700" fill="#c4502b" letter-spacing="3">WORKFLOW 01 · CORE ATHLETICS ENGINE</text>
  <text x="80" y="96" font-size="28" font-weight="800" fill="#f8f6f0" letter-spacing="-0.5">Court Reservation &amp; Collision Invariant Pipeline</text>
  <rect x="1310" y="55" width="210" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="1328" cy="72" r="5" fill="#c4502b" />
  <text x="1342" y="77" font-size="11" font-weight="600" fill="#c4502b" letter-spacing="1">INVARIANTS 1 &amp; 2 ACTIVE</text>

  <!-- 5-STEP HORIZONTAL PIPELINE -->

  <!-- STEP 1 -->
  <g transform="translate(80, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#clayGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">01</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#c4502b" letter-spacing="1">SURFACE DISCOVERY</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Slot Selection</text>

    <!-- Content -->
    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">18 Arena Matrix</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Tennis · Badminton · Squash</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Padel · Pickleball · Pool</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Indoor Acclimatized &amp; Outdoor</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#e5b842">30-min staggered offset</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Input Parameters</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">Date: Today / Upcoming 7d</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">Duration: 60 / 90 / 120 min</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">Surface: Clay, DecoTurf, Grass</text>
    <text x="32" y="314" font-size="11" fill="#8f8c82">Lighting: Floodlight toggle</text>
    <text x="32" y="336" font-size="10.5" fill="#2d6a4f">✓ Live court status sync</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#c4502b" letter-spacing="1">CLIENT ACTION</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">User clicks slot</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">POST /api/bookings payload</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="345" y1="375" x2="365" y2="375" stroke="#c4502b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 2 -->
  <g transform="translate(370, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#clayGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">02</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#c4502b" letter-spacing="1">INVARIANT GUARD</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Quota &amp; DPDP Check</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Invariant 2 Check</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Max 2 Bookings / Day / Member</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Query: COUNT(*) active on date</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">If count &gt;= 2: Return 409</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#2d6a4f">✓ Fair share distribution</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Eligibility Verification</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">Membership: Active status</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">DPDP 2023: Minor Consent</text>
    <text x="32" y="292" font-size="10.5" fill="#e5b842">Age &lt; 18 requires verified</text>
    <text x="32" y="310" font-size="10.5" fill="#e5b842">parental consent token</text>
    <text x="32" y="334" font-size="11" fill="#8f8c82">Account Suspensions: None</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#c4502b" letter-spacing="1">VALIDATION OUTCOME</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Pass: Next Invariant</text>
    <text x="32" y="430" font-size="10" fill="#e5b842">Fail: Friendly reason modal</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="635" y1="375" x2="655" y2="375" stroke="#c4502b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 3 -->
  <g transform="translate(660, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#c4502b" stroke-width="1.5" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#clayGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">03</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#c4502b" letter-spacing="1">CRITICAL INVARIANT</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">GIST Collision Lock</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#c4502b" stroke-opacity="0.3" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#c4502b">Invariant 1 Protection</text>
    <text x="32" y="118" font-size="10.5" font-family="monospace" fill="#f8f6f0">EXCLUDE USING gist (</text>
    <text x="40" y="136" font-size="10.5" font-family="monospace" fill="#f8f6f0">court_id WITH =, </text>
    <text x="40" y="154" font-size="10.5" font-family="monospace" fill="#f8f6f0">tsrange(start, end) WITH &amp;&amp;</text>
    <text x="32" y="172" font-size="10.5" font-family="monospace" fill="#f8f6f0">)</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">ACID Concurrency</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">Atomic Postgres Transaction</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">Zero race condition window</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">If 2 users hit same slot at ms 0:</text>
    <text x="32" y="312" font-size="10.5" font-weight="600" fill="#2d6a4f">1st committed · 2nd rejected</text>
    <text x="32" y="334" font-size="10.5" fill="#8f8c82">No phantom double-bookings</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#c4502b" stroke-opacity="0.2" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#c4502b" letter-spacing="1">ZERO TOLERANCE</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">100% collision-free guarantee</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Enforced at DB kernel level</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="925" y1="375" x2="945" y2="375" stroke="#c4502b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 4 -->
  <g transform="translate(950, 140)" filter="url(#cardShadow)">
    <rect width="265" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#goldGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">04</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#e5b842" letter-spacing="1">LEDGER &amp; TAX</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Pricing &amp; Ledger</text>

    <rect x="20" y="75" width="225" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Tier Subsidy Matrix</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">Gold: 50% Subsidized rate</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Silver: 30% Subsidized rate</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Guest: Full Standard rate</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#e5b842">e.g. ₹1,200 → ₹840 Net</text>

    <rect x="20" y="200" width="225" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">GST SAC Compliance</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">SAC Code: 999724 (Sports)</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">18% GST (9% CGST + 9% SGST)</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">Payment Method Recorded:</text>
    <text x="32" y="312" font-size="10.5" fill="#f8f6f0">Lounge Tab / Card / UPI</text>
    <text x="32" y="334" font-size="10.5" fill="#2d6a4f">Double-entry audit log created</text>

    <rect x="20" y="365" width="225" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#e5b842" letter-spacing="1">FINANCIAL ENTRY</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Appended to Daily Ledger</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Synced to Owner Z-Report</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="1215" y1="375" x2="1235" y2="375" stroke="#c4502b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 5 -->
  <g transform="translate(1240, 140)" filter="url(#cardShadow)">
    <rect width="280" height="470" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#greenGrad)" />
    <text x="32" y="44" font-size="16" font-weight="800" fill="#ffffff">05</text>
    <text x="68" y="34" font-size="11" font-weight="700" fill="#2d6a4f" letter-spacing="1">PASS &amp; BROADCAST</text>
    <text x="68" y="52" font-size="16" font-weight="700" fill="#f8f6f0">Sync &amp; QR Pass</text>

    <rect x="20" y="75" width="240" height="110" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="98" font-size="12" font-weight="700" fill="#f8f6f0">Dynamic QR Member Pass</text>
    <text x="32" y="118" font-size="11" fill="#8f8c82">SHA-256 HMAC Encrypted</text>
    <text x="32" y="136" font-size="11" fill="#8f8c82">Court Access ID + Slot Window</text>
    <text x="32" y="156" font-size="11" fill="#8f8c82">Turnstile &amp; Desk Scanner scan</text>
    <text x="32" y="174" font-size="10" font-weight="600" fill="#2d6a4f">✓ Offline cached in PWA</text>

    <rect x="20" y="200" width="240" height="150" rx="8" fill="#21201c" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="224" font-size="12" font-weight="700" fill="#f8f6f0">Multi-Surface Broadcast</text>
    <text x="32" y="248" font-size="11" fill="#8f8c82">1. BroadcastChannel API</text>
    <text x="32" y="270" font-size="11" fill="#8f8c82">2. Front Desk POS refreshed</text>
    <text x="32" y="292" font-size="11" fill="#8f8c82">3. Member Dashboard updated</text>
    <text x="32" y="312" font-size="11" fill="#8f8c82">4. Next Session card armed</text>
    <text x="32" y="334" font-size="10.5" fill="#2d6a4f">All screens match instantly</text>

    <rect x="20" y="365" width="240" height="85" rx="8" fill="#141310" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="32" y="390" font-size="10" font-weight="700" fill="#2d6a4f" letter-spacing="1">CONFIRMED RESERVATION</text>
    <text x="32" y="410" font-size="11" fill="#f8f6f0">Booking state: CONFIRMED</text>
    <text x="32" y="430" font-size="10" fill="#8f8c82">Available for 1-click cancel</text>
  </g>

  <!-- BOTTOM SUMMARY CARD -->
  <g transform="translate(80, 640)" filter="url(#cardShadow)">
    <rect width="1440" height="160" rx="14" fill="#181714" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="28" y="24" width="6" height="112" rx="3" fill="url(#clayGrad)" />
    
    <text x="50" y="48" font-size="11" font-weight="700" fill="#c4502b" letter-spacing="2">ARCHITECTURAL HIGHLIGHTS FOR SLIDES</text>
    <text x="50" y="74" font-size="18" font-weight="700" fill="#f8f6f0">Why This Collision &amp; Quota Invariant Engine Outperforms Traditional Booking Engines</text>
    
    <g transform="translate(50, 95)">
      <circle cx="6" cy="6" r="4" fill="#c4502b" />
      <text x="20" y="10" font-size="12" font-weight="600" fill="#f8f6f0">Zero Double-Booking Guarantee:</text>
      <text x="240" y="10" font-size="12" fill="#a09d95">Database-level GIST range exclusion prevents simultaneous overlaps even under peak concurrent member load.</text>
      
      <circle cx="6" cy="30" r="4" fill="#e5b842" />
      <text x="20" y="34" font-size="12" font-weight="600" fill="#f8f6f0">Automated Daily Play Cap:</text>
      <text x="240" y="34" font-size="12" fill="#a09d95">Protects 18-arena availability by capping plays to 2 slots per day, resetting automatically at midnight IST.</text>
      
      <circle cx="6" cy="54" r="4" fill="#2d6a4f" />
      <text x="20" y="58" font-size="12" font-weight="600" fill="#f8f6f0">Sub-Second Multi-Screen Sync:</text>
      <text x="240" y="58" font-size="12" fill="#a09d95">Front Desk, Turnstile, and Member mobile apps share unified state with zero phantom slots or stale bookings.</text>
    </g>
  </g>
</svg>
